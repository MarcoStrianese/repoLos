<title>LOS · Life Operating System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — mobile: header + scrolling view + bottom tab bar; desktop: sidebar + wide view. Sheets for detail. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F4F5F9; --surface-3:#E6E9F0;
  --ink:#121521; --muted:#5B6274; --faint:#8A90A0; --line:#DCE0E8;
  --accent:#3046F0; --accent-ink:#FFFFFF; --accent-soft:#E3E7FF;
  --work:#3046F0; --work-soft:#E3E7FF;
  --fin:#C77700; --fin-soft:#FFF0D6;
  --sport:#D93A48; --sport-soft:#FFE3E5;
  --diet:#1F8A5B; --diet-soft:#DAF3E6;
  --books:#7C46C2; --books-soft:#EEE3FB;
  --good:#1F8A5B; --warn:#C77700; --bad:#D93A48;
  --shadow:0 1px 2px rgba(18,21,33,.06),0 8px 24px -12px rgba(18,21,33,.18);
  --scrim:rgba(14,17,26,.42);
  --f-display:"Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F16; --surface:#151923; --surface-2:#1B202C; --surface-3:#242A38; --ink:#EDEFF5; --muted:#9AA1B2; --faint:#6E7586; --line:#272E3D;
  --accent:#7B8BFF; --accent-ink:#0C0F16; --accent-soft:#232B55;
  --work:#7B8BFF; --work-soft:#232B55; --fin:#F2A93B; --fin-soft:#3A2B12; --sport:#FF6B76; --sport-soft:#3E1C22; --diet:#4CC98E; --diet-soft:#15362A; --books:#B58CF0; --books-soft:#2E2244;
  --good:#4CC98E; --warn:#F2A93B; --bad:#FF6B76; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F16; --surface:#151923; --surface-2:#1B202C; --surface-3:#242A38; --ink:#EDEFF5; --muted:#9AA1B2; --faint:#6E7586; --line:#272E3D;
  --accent:#7B8BFF; --accent-ink:#0C0F16; --accent-soft:#232B55;
  --work:#7B8BFF; --work-soft:#232B55; --fin:#F2A93B; --fin-soft:#3A2B12; --sport:#FF6B76; --sport-soft:#3E1C22; --diet:#4CC98E; --diet-soft:#15362A; --books:#B58CF0; --books-soft:#2E2244;
  --good:#4CC98E; --warn:#F2A93B; --bad:#FF6B76; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.topbar .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint);border-radius:12px;transition:color .2s}
.tab svg{width:23px;height:23px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tab.on{color:var(--c,var(--accent))}
.tab.on svg{transform:translateY(-2px) scale(1.08)}
@media (min-width:900px){
  .app{grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:4px 10px 18px}
  .snav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--muted)}
  .snav svg{width:20px;height:20px}
  .snav:hover{background:var(--surface-2)}
  .snav.on{background:var(--surface-2);color:var(--c,var(--accent))}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
  .tabbar{display:none}
  .topbar .brand,.topbar .menubtn{display:none}
  .main{padding-bottom:40px;padding-left:36px;padding-right:36px}
  .topbar{margin:0 -36px;padding-left:36px;padding-right:36px}
  .view{max-width:1120px}
}
.view{animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- primitives ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.tap{cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.tap:hover{box-shadow:0 1px 2px rgba(18,21,33,.06),0 14px 30px -14px rgba(18,21,33,.3)}
.tap:active{transform:scale(.985)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.section-h h2{font-size:19px}
.link{color:var(--accent);font-weight:600;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .15s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.neutral{background:var(--surface-3);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.seg{display:flex;background:var(--surface-3);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--ink);color:var(--bg);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s;background:var(--surface)}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1);color:#fff}
.check.on{background:var(--c,var(--good));border-color:var(--c,var(--good))}
.check.on svg{opacity:1;transform:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:700px){.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}}
@media (max-width:699px){.grid-auto{display:flex;flex-direction:column;gap:12px}}
.cols{display:grid;gap:16px}
@media (min-width:1000px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.hr{height:1px;background:var(--line);margin:4px 0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--s,var(--surface-3));color:var(--c,var(--ink))}
.ico svg{width:20px;height:20px}
.big{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em}
.note-demo{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center}
.note-demo::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--faint)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-md)}

/* ---------- page head ---------- */
.phead{display:flex;flex-direction:column;gap:4px;padding:6px 0 16px}
.phead h1{font-size:30px;line-height:1.05}
@media (min-width:900px){.phead h1{font-size:36px}}

/* ---------- today ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border-radius:14px;background:var(--surface);transition:all .2s;position:relative}
.wd .n{font-family:var(--f-display);font-weight:700;font-size:18px}
.wd .l{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wd .marks{display:flex;gap:3px;height:5px}
.wd .marks i{width:5px;height:5px;border-radius:50%}
.wd.on{background:var(--ink);color:var(--bg)}
.wd.on .l{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.wd.today:not(.on)::after{content:"";position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{padding:12px;border-radius:16px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1}
.kpi .s{font-size:12px;color:var(--muted);line-height:1.25}
.ring{width:42px;height:42px}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:stretch}
.tl .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:18px;text-align:right;position:relative}
.tl .t::after{content:"";position:absolute;right:-19px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.tl .body{padding:6px 0 6px 14px;border-left:2px solid var(--line);margin-left:-8px}
.tl:last-child .body{border-left-color:transparent}
.ev{border-radius:18px;padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--c)}
.ev .h{display:flex;align-items:center;gap:10px}
.ev .h b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.015em}
.ev .sub{font-size:13px;color:var(--muted)}
.ev .meta{margin-left:auto;display:flex;align-items:center;gap:6px}
.ev.done{opacity:.6}
.ev.skip{background:transparent;box-shadow:none;border:1.5px dashed var(--line);border-left:4px solid var(--line)}
.sug{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.sug .k{width:6px;height:6px;border-radius:2px;margin-top:7px;flex:none;background:var(--c)}
.advisor{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:var(--fin-soft);color:var(--ink)}
.advisor .amt{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.04em;line-height:1;color:var(--fin)}
.advisor .wave{position:absolute;right:-20px;top:-20px;width:150px;height:150px;opacity:.18;color:var(--fin)}

/* ---------- work ---------- */
.proj{display:flex;flex-direction:column;gap:10px;border-radius:18px;background:var(--surface);padding:14px;box-shadow:var(--shadow)}
.proj .top{display:flex;align-items:flex-start;gap:10px}
.proj h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.prio{display:inline-flex;gap:2px}
.prio i{width:5px;height:12px;border-radius:2px;background:var(--line)}
.prio i.on{background:var(--c,var(--work))}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar>span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c,var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.type-azienda{--c:var(--work);--s:var(--work-soft)}
.type-interno{--c:var(--books);--s:var(--books-soft)}
.type-personale{--c:var(--diet);--s:var(--diet-soft)}
.standby-note{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:flex;gap:8px;align-items:center}

/* ---------- finance ---------- */
.catcard{display:flex;flex-direction:column;gap:10px;border-radius:18px;background:var(--surface);padding:14px;box-shadow:var(--shadow)}
.catcard .amt{font-family:var(--f-mono);font-weight:600;font-size:21px}
.gauge{position:relative;height:10px;border-radius:99px;background:var(--surface-3)}
.gauge .sp{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c,var(--fin));z-index:2;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge .fc{position:absolute;inset:0 auto 0 0;border-radius:99px;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c,var(--fin)) 45%,transparent) 0 4px,transparent 4px 8px);z-index:1}
.gauge .avg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;z-index:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:8px;border-radius:3px;display:inline-block}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .am{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.tx .am.in{color:var(--good)}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td:first-child{font-family:var(--f-body);font-weight:600}
table.t th.r,table.t td.r{text-align:right}
.pos{color:var(--good)} .neg{color:var(--bad)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--c,var(--accent));color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 12px 28px -10px color-mix(in srgb,var(--c,var(--accent)) 70%,transparent);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:scale(.94)}
.fab svg{width:22px;height:22px}
@media (min-width:900px){.fab{bottom:28px;right:32px}}

/* ---------- sport / diet ---------- */
.day{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dn{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.day .dn b{font-family:var(--f-display);font-size:20px;line-height:1}
.day .dn span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:600;letter-spacing:.05em}
.day.today .dn b{color:var(--accent)}
.wo{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sport-soft)}
.wo .grow b{display:block;font-size:14px}
.wo .grow span{font-size:12px;color:var(--muted)}
.wo.done{background:var(--surface-2)}
.wo.done b{text-decoration:line-through;text-decoration-color:var(--faint)}
.rest{font-size:13px;color:var(--faint);padding:10px 0}
.acc{border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;text-align:left}
.acc .chev{margin-left:auto;transition:transform .25s;color:var(--muted)}
.acc.open .chev{transform:rotate(180deg)}
.acc .in{display:none;padding:0 14px 14px}
.acc.open .in{display:block}
.ex{font-size:14px;padding:3px 0;white-space:pre-wrap}
.ex.hd{font-weight:700;margin-top:8px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:32px;height:32px;color:var(--muted)}
.scan{height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden;width:100%}
.scan span{display:block;height:100%;width:30%;background:var(--accent);border-radius:99px;animation:scan 1s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.mealgrid{display:grid;grid-template-columns:auto repeat(7,minmax(92px,1fr));gap:6px;min-width:760px}
.mealgrid .hd{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;padding:4px}
.mealgrid .cell{padding:8px;border-radius:10px;background:var(--surface-2);font-size:12px;line-height:1.3;min-height:52px;cursor:pointer;transition:background .15s}

const avg = a => a.reduce((s,x)=>s+x,0)/(a.length||1);
function monthTx(m){ return TX.filter(t=>t.date.startsWith(m)); }
function catSpent(cats,m){ return -monthTx(m).filter(t=>cats.includes(t.cat)&&t.amt<0).reduce((s,t)=>s+t.amt,0); }
function catAvg(cats){ return cats.reduce((s,c)=>s+avg(HIST[c]||[0]),0); }
function forecast(w){
  const m = S.finMonth, y=+m.slice(0,4), mo=+m.slice(5)-1;
  const dim = new Date(y,mo+1,0).getDate();
  const isCur = m === iso(TODAY).slice(0,7);
  const a = catAvg(w.cats);
  if(!isCur){ const i=HIST_LABELS.indexOf(m); const sp=w.cats.reduce((s,c)=>s+(HIST[c]?.[i]||0),0); return {spent:sp,avg:a,fc:sp,next:null,why:'Mese chiuso'}; }
  const spent = catSpent(w.cats,m);
  let extra = 0, nexts = [], why = [];
  w.cats.forEach(c=>{
    const mine = monthTx(m).filter(t=>t.cat===c&&t.amt<0);
    if(BILLS.includes(c)){
      if(!mine.length){ extra += avg(HIST[c]); why.push('bolletta non ancora arrivata'); }
      else why.push('bolletta già pagata');
      return;
    }
    const r = RHYTHM[c]; if(!r) return;
    const last = mine.length ? pd(mine[mine.length-1].date) : addDays(TODAY,-Math.round(r.int/2));
    let next = addDays(last, r.int), n = 0;
    while(next.getMonth()===mo && next.getFullYear()===y){ if(next>=TODAY) n++; next = addDays(next,r.int); }
    let firstNext = addDays(last,r.int); while(firstNext<TODAY) firstNext = addDays(firstNext,r.int);
    nexts.push(firstNext);
    extra += n*r.ticket;
    why.push(n? `${n} ${c==='benzina'?'pieni':'acquisti'} attesi entro fine mese (ogni ~${r.int} gg, ~${eur0(r.ticket)} l'uno)` : `prossimo ${c==='benzina'?'pieno':'acquisto'} previsto il ${fmtDay(firstNext)}, già nel mese dopo`);
  });
  const next = nexts.length ? nexts.sort((a,b)=>a-b)[0] : null;
  return {spent,avg:a,fc:spent+extra,extra,next,why:why.join(' · ')};
}
function fixedDueRemaining(){
  const y=TODAY.getFullYear(), mo=TODAY.getMonth(); const out=[];
  FIXED.filter(f=>f.active).forEach(f=>{
    const inMonth = f.rule==='monthly' || (f.months||[]).includes(mo+1);
    if(!inMonth) return;
    const due = new Date(y,mo,Math.min(f.day,new Date(y,mo+1,0).getDate()));
    const paid = TX.some(t=>t.date.startsWith(iso(TODAY).slice(0,7)) && Math.abs(Math.abs(t.amt)-f.amt)<.02);
    if(due>=TODAY && !paid) out.push({...f,due});
  });
  return out;
}

    const ok = f.rule==='monthly' || (f.months||[]).includes(d.getMonth()+1);

function advisor(){
  const m = iso(TODAY).slice(0,7);
  const income = monthTx(m).filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0);
  const spent = -monthTx(m).filter(t=>t.amt<0).reduce((s,t)=>s+t.amt,0);
  const due = fixedDueRemaining(); const dueTot = due.filter(f=>f.cat!=='investimenti').reduce((s,f)=>s+f.amt,0);
  const pac = FIXED.filter(f=>f.active&&f.cat==='investimenti').reduce((s,f)=>s+f.amt,0);
  const pacPaid = monthTx(m).some(t=>t.cat==='investimenti');
  const save = pacPaid?0:pac;
  const variable = WATCH.reduce((s,w)=>{ const f=forecast({...w}); return s+(f.fc-f.spent); },0);
  const margin = income - spent - dueTot - save - variable;
  const extraord = monthTx(m).filter(t=>['dentista','altro'].includes(t.cat)).reduce((s,t)=>s-t.amt,0);
  // weekend rimasti nel mese (sabato da oggi in poi; un weekend a cavallo conta)
  let we=0; for(let d=new Date(TODAY); d.getMonth()===TODAY.getMonth(); d=addDays(d,1)) if(d.getDay()===6) we++;
  we = Math.max(we,1);
  const allowance = Math.max(0,margin)/we;
  const avgSvago = catAvg(['ristorante','aperitivi'])/4.3;
  let level = margin<0?'bad':allowance<avgSvago?'warn':'good';
  const verdict = level==='good'?'Hai margine: goditi il weekend.':level==='warn'?'Margine ridotto: scegli un\'uscita sola.':'Weekend a costo quasi zero.';
  return {income,spent,dueTot,due,save,variable,margin,we,allowance,avgSvago,level,verdict,extraord};
}

const TW = {azienda:3, interno:1.4, personale:1};
const PW = {1:1, 2:1.6, 3:2.2};
function suggestions(day){
  const out = [], follow = [];
  PROJECTS.forEach(p=>{
    if(p.status==='chiuso') return;
    if(p.status==='standby'){
      const wait = daysBetween(pd(p.since), day);
      if(wait>=5) follow.push({p, text:`Sollecita: ${p.waiting}`, reasons:[`in attesa da ${wait} gg`], score:TW[p.type]*PW[p.prio]});
      return;
    }
    const dl = p.deadline ? daysBetween(day,pd(p.deadline)) : null;
    p.todos.forEach((t,ti)=>{
      if(t.d) return;
      const urg = dl===null ? 1 : 1 + 4/(Math.max(dl,0)+1);
      const score = TW[p.type]*PW[p.prio]*urg - ti*0.05;
      const reasons = [];
      if(p.type==='azienda') reasons.push('fattura');
      if(p.prio===3) reasons.push('priorità alta');
      if(dl!==null && dl<=10) reasons.push(dl<=0?'scaduto':`scade tra ${dl} gg`);
      out.push({p,ti,t,score,reasons});
    });
  });
  out.sort((a,b)=>b.score-a.score);
  const focus = [], seen = {};
  for(const s of out){ if(s.p.type!=='azienda') continue; if((seen[s.p.id]||0)>=2) continue; seen[s.p.id]=(seen[s.p.id]||0)+1; focus.push(s); if(focus.length>=3) break; }
  const filler = out.filter(s=>s.p.type!=='azienda').slice(0,3);
  return {focus, filler, follow};
}

  let lab=labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`).join('');

  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3}" fill="${i===vals.length-1?color:'var(--surface)'}" stroke="${color}" stroke-width="2"><title>${labels[i]}: ${num(v,dec)}${unit}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block;overflow:visible"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}${tl}<path d="${area}" fill="url(#${gid})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lab}</svg>`;
}
function barsInOut(rows){ // rows: [label,in,out]
  const W=600,H=200,pl=44,pr=8,pt=10,pb=26; const mx=Math.max(...rows.flatMap(r=>[r[1],r[2]]))*1.08||1;
  const step=(W-pl-pr)/rows.length, bw=Math.min(14,step*.32);
  let g=''; for(let i=0;i<=4;i++){ const v=mx*i/4, yy=pt+(H-pt-pb)*(1-i/4); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--faint)">${Math.round(v/100)/10}k</text>`; }
  const b=rows.map((r,i)=>{ const cx=pl+step*i+step/2; const hi=(H-pt-pb)*r[1]/mx, ho=(H-pt-pb)*r[2]/mx;
    return `<rect x="${cx-bw-1}" y="${H-pb-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--good)"><title>${r[0]} entrate ${eur(r[1])}</title></rect><rect x="${cx+1}" y="${H-pb-ho}" width="${bw}" height="${ho}" rx="3" fill="var(--fin)"><title>${r[0]} uscite ${eur(r[2])}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${r[0]}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block">${g}${b}</svg>`;
}
function miniBars(vals,labels,color){
  const W=600,H=150,pl=8,pr=8,pt=18,pb=24; const mx=Math.max(...vals,1); const step=(W-pl-pr)/vals.length, bw=step*.62;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block">${vals.map((v,i)=>{const h=(H-pt-pb)*v/mx, x=pl+step*i+(step-bw)/2; return `<rect x="${x}" y="${H-pb-h}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="${color}" opacity="${i===vals.length-1?1:.55}"><title>${labels[i]}: ${eur(v)}</title></rect>${i===vals.length-1?`<text x="${x+bw/2}" y="${H-pb-h-5}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${Math.round(v)}</text>`:''}<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${labels[i]}</text>`}).join('')}</svg>`;

function donut(parts,total,center){
  const R=70,r=48,C=2*Math.PI; let a=-Math.PI/2; let paths='';
  parts.forEach(p=>{ const ang=C*p.v/total; if(ang<=0) return; const a2=a+ang-0.012; const large=ang>Math.PI?1:0;
    const P=(rad,an)=>[90+rad*Math.cos(an),90+rad*Math.sin(an)];
    const [x1,y1]=P(R,a),[x2,y2]=P(R,a2),[x3,y3]=P(r,a2),[x4,y4]=P(r,a);
    paths+=`<path d="M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4}Z" fill="${p.c}"><title>${p.l}: ${eur(p.v)}</title></path>`; a+=ang; });
  return `<svg viewBox="0 0 180 180" width="170" height="170" role="img" style="flex:none">${paths}<text x="90" y="86" text-anchor="middle" font-size="11" fill="var(--muted)">uscite</text><text x="90" y="106" text-anchor="middle" font-size="17" font-weight="600" fill="var(--ink)">${center}</text></svg>`;
}
function ring(p,color){ const R=17,C=2*Math.PI*R; return `<svg class="ring" viewBox="0 0 42 42"><circle cx="21" cy="21" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="5"/><circle cx="21" cy="21" r="${R}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C*Math.min(p,1)} ${C}" transform="rotate(-90 21 21)"/></svg>`; }

function goalErr(g){
  if(g.unit==='tempo'){ const s=t=>t.split(':').reduce((a,x)=>a*60+ +x,0); const e=s(g.cur)-s(g.set); const m=Math.floor(Math.abs(e)/60), ss=Math.abs(e)%60; return {txt:(e>0?'+':'−')+m+':'+String(ss).padStart(2,'0'), ok:e<=0, p:Math.min(1,s(g.set)/s(g.cur))}; }
  const e = g.cur-g.set; const ok = g.lowerBetter? e<=0 : e>=0;
  const p = g.lowerBetter? Math.min(1,g.set/g.cur) : Math.min(1,g.cur/g.set);
  return {txt:(e>0?'+':e<0?'−':'')+num(Math.abs(e),g.unit==='%'?1:0)+(g.unit==='%'?' pt':''), ok, p};
}

    }, 1400);

    <div class="card"><div class="chips">${Object.entries(metr).map(([kk,v])=>`<button class="chip ${k===kk?'on':''}" data-act="bm" data-k="${kk}">${v[0]} ${v[1]}</button>`).join('')}</div>
      <div style="margin-top:12px">${lineChart(BODY.map(b=>b[k]),BODY.map(b=>MON[pd(b.d).getMonth()]+' '+b.d.slice(2,4)),{color:'var(--diet)',unit:metr[k][1]==='%'?'%':' kg',target:k==='mgp'?12:null})}</div></div>

let TXSIGN = -1;
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, D = el.dataset;
  const stop = () => e.stopPropagation();
  switch(a){
    case 'close': closeSheet(); break;
    case 'day': S.day = pd(D.d); render(); break;
    case 'wk': S.day = addDays(S.day,+D.n); buildWeek(monday(S.day)); render(); break;
    case 'workday': sheetWorkday(); break;
    case 'meal': sheetMeal(D.meal); break;
    case 'shuffle': { const cur=mealFor(S.day,D.meal); const pool=DISHES[D.meal].filter(x=>x.id!==cur.id && !x.free && !(D.meal==='spuntino2'&&x.train&&!trainingOn(S.day))); const pick=pool[Math.floor(Math.random()*pool.length)]; (DAYOVERRIDE[iso(S.day)]=DAYOVERRIDE[iso(S.day)]||{})[D.meal]=pick.id; sheetMeal(D.meal); render(); toast('Nuova proposta: '+pick.name); break; }
    case 'pickmeal': (DAYOVERRIDE[iso(S.day)]=DAYOVERRIDE[iso(S.day)]||{})[D.meal]=D.id; sheetMeal(D.meal); render(); break;
    case 'wo': if(e.target.closest('.check')) return; sheetWorkout(D.day,D.id); break;
    case 'wodone': { stop(); const s=(PLAN[D.day]||[]).find(x=>x.id===D.id); s.done=!s.done; if(D.close) closeSheet(); render(); if(s.done) toast('Allenamento completato'); break; }
    case 'womove': { const s=PLAN[D.day].find(x=>x.id===D.id); PLAN[D.day]=PLAN[D.day].filter(x=>x!==s); const nk=iso(addDays(pd(D.day),1)); buildWeek(monday(pd(nk))); (PLAN[nk]=PLAN[nk]||[]).push(s); closeSheet(); render(); toast('Spostato a '+DOWL[pd(nk).getDay()].toLowerCase()); break; }
    case 'wodel': PLAN[D.day]=PLAN[D.day].filter(x=>x.id!==D.id); closeSheet(); render(); toast('Sessione rimossa'); break;
    case 'addwo': stop(); sheetAddWorkout(D.day||iso(S.view==='sport'?S.sportWeek:S.day)); break;
    case 'todo': { stop(); const p=PROJECTS.find(x=>x.id==D.p); p.todos[+D.t].d=!p.todos[+D.t].d; if(D.keep) sheetProject(p.id); else { el.classList.add('on'); setTimeout(()=>{ sheetWorkday(); render(); },350); toast('Attività completata · '+p.name); } render(); break; }
    case 'unblock': { const p=PROJECTS.find(x=>x.id==D.p); p.status='attivo'; sheetWorkday(); render(); toast(p.name+' torna attivo'); break; }
    case 'wf': S.workFilter=D.k; render(); break;
    case 'proj': sheetProject(+D.id); break;
    case 'pstatus': { const p=PROJECTS.find(x=>x.id==D.id); p.status=D.k; if(D.k==='standby'){p.waiting=p.waiting||'risposta del cliente'; p.since=iso(TODAY);} sheetProject(p.id); render(); break; }
    case 'pprio': { const p=PROJECTS.find(x=>x.id==D.id); p.prio=+D.k; sheetProject(p.id); render(); break; }
    case 'ptype': { const p=PROJECTS.find(x=>x.id==D.id); p.type=D.k; sheetProject(p.id); render(); break; }
    case 'newproj': sheetNewProject(); break;
    case 'ft': S.finTab=D.k; render(); break;
    case 'fm': { const [y,m]=S.finMonth.split('-').map(Number); const d=new Date(y,m-1+(+D.n),1); const k=iso(d).slice(0,7); if(k>'2026-10'||k<'2025-10') return; S.finMonth=k; render(); break; }
    case 'fy': S.finYear=+D.k; render(); break;
    case 'cat': sheetCat(D.id); break;
    case 'watchcfg': sheetWatchCfg(); break;
    case 'unwatch': WATCH=WATCH.filter(w=>w.id!==D.id); sheetWatchCfg(); render(); break;
    case 'txf': S.txFilter=D.k; render(); break;
    case 'deltx': TX=TX.filter(t=>t.id!=D.id); render(); toast('Movimento eliminato'); break;
    case 'newtx': TXSIGN=-1; sheetNewTx(); break;
    case 'txsign': TXSIGN=+D.k; el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el)); break;
    case 'newfixed': sheetNewFixed(); break;
    case 'fxtoggle': { const f=FIXED.find(x=>x.id==D.id); f.active=!f.active; render(); break; }
    case 'fxdel': FIXED=FIXED.filter(x=>x.id!=D.id); render(); toast('Spesa fissa rimossa'); break;
    case 'acc': sheetAcc(+D.id); break;
    case 'newacc': sheetAcc(null); break;
    case 'accdel': ACCOUNTS=ACCOUNTS.filter(x=>x.id!=D.id); closeSheet(); render(); break;
    case 'st': S.sportTab=D.k; render(); break;
    case 'sw': S.sportWeek=addDays(S.sportWeek,+D.n); render(); break;
    case 'defday': { const k=+D.k; DEFAULT_DAYS = DEFAULT_DAYS.includes(k)?DEFAULT_DAYS.filter(x=>x!==k):DEFAULT_DAYS.concat(k); render(); toast('Vale dalle prossime settimane'); break; }
    case 'strava': STRAVA=!STRAVA; if(STRAVA){ const k='2026-10-27'; (PLAN[k]||[]).forEach(s=>s.done=true); } render(); toast(STRAVA?'Strava collegato':'Strava scollegato'); break;
    case 'acc-t': el.parentNode.classList.toggle('open'); break;
    case 'useScheda': SCHEDA={name:'stria 06.06',days:[
        {g:1,title:'Bike + run, deadlift, EMOM',body:"20' bike 80/90 rpm + 20' run easy\nDeadlift 1×10 (65%), 1×8 (75%), 1×6 (85%)\nEMOM 10' alt: 10 DB bench press / 8 box jump"},
        {g:2,title:'Threshold run 5×7\'',body:"Threshold run 5×7' rest 2'\n100 walking lunges peso gara\n3 round: 10 push press, 10 snatch\n3 round: 30 russian twist, 30\" plank"},
        {g:3,title:'Bike C2, EMOM, AMRAP',body:"5× (10' dumper 5 180 W, 10' dumper 1 easy)\nEMOM 10': 5 pull up, 5 dip\nAMRAP 10': 10 box jump, 10 hand release push up"},
        {g:4,title:'Easy run 1h, EMOM',body:"Easy run 1h\nEMOM 10' alt: 8 push press / 5 burpees to plate\nEMOM 10': 10 wall ball 12 kg\n50 sit up"},
        {g:5,title:'Threshold run 10×3\'',body:"Threshold run 10×3' rest 1'\n100 m BBJ\nFor time: 100 military press\nAMRAP 10': 10 thruster, 20 russian swing, 30 crunch"},
        {g:6,title:'Bike 1h30\' easy',body:"Bike 1h30' easy"},
        {g:7,title:'Run progressivo, deadlift, AMRAP',body:"40' run progressivo fino al 70% del ritmo dei 1000\nEMOM 10': 8 deadlift 70%\nAMRAP 20': 400 m run, 30 m lunges, 30 wall ball"},
        {g:8,title:'EMOM 40\' o nuoto',body:"Alt. 1 · EMOM 40': 15 cal ski, 10 cal assault bike, 15 cal row, 20 swing\nAlt. 2 · 40' nuoto o corsa easy, 30' bike, 3 round 12 sit up + 30\" plank"},
      ]}; Object.keys(PLAN).forEach(k=>{ if(pd(k)>=monday(addDays(TODAY,7))) delete PLAN[k]; }); render(); toast('Scheda attiva da lunedì 2 novembre'); break;
    case 'dropParse': $('#parseOut').innerHTML=''; break;
    case 'clearBP': $('#bodyParse').innerHTML=''; break;
    case 'newrace': sheetNewRace(); break;
    case 'dt': S.dietTab=D.k; render(); break;
    case 'dd': S.day=addDays(S.day,+D.n); buildWeek(monday(S.day)); render(); break;
    case 'bm': S.bodyMetric=D.k; render(); break;
    case 'wmcell': sheetWmCell(+D.d,D.meal); break;
    case 'wmset': WEEKMENU[+D.d][D.meal]=D.id||null; closeSheet(); render(); break;
    case 'dishdel': DISHES[D.meal]=DISHES[D.meal].filter(x=>x.id!==D.id); render(); toast('Piatto rimosso'); break;
    case 'newdish': sheetNewDish(); break;
    case 'newbody': sheetNewBody(); break;
    case 'newbook': case 'newresto': case 'newnote': case 'newgoal': sheetSimple(a); break;
    case 'logout': $('#login').classList.remove('gone'); break;
    case 'reset': location.reload(); break;
  }
});
document.addEventListener('input', e=>{
  const el=e.target; const k=el.dataset.actInput; if(!k) return; const p=PROJECTS.find(x=>x.id==el.dataset.id);
  if(k==='pwait') p.waiting=el.value; if(k==='pdl') p.deadline=el.value||null; if(k==='pnotes') p.notes=el.value;
  clearTimeout(window._rt); window._rt=setTimeout(render,400);
});
const pnum = s => parseFloat(String(s).replace(/\./g,'').replace(',','.'));
document.addEventListener('submit', e=>{
  e.preventDefault(); const f=e.target; const v=id=>f.querySelector('#'+id)?.value?.trim();
  switch(f.id){
    case 'loginForm': $('#login').classList.add('gone'); try{localStorage.setItem('los-auth','1')}catch(x){} break;
    case 'fTodo': { const p=PROJECTS.find(x=>x.id==f.dataset.id); if(!v('todoIn')) return; p.todos.push({t:v('todoIn'),d:false}); sheetProject(p.id); render(); break; }
    case 'fProj': PROJECTS.unshift({id:Date.now(),name:v('npName'),client:v('npClient'),type:v('npType'),status:'attivo',prio:+v('npPrio'),deadline:v('npDl')||null,todos:[],notes:''}); closeSheet(); render(); toast('Progetto creato'); break;
    case 'fTx': { const amt=pnum(v('txAmt')); if(!amt) return; const c=f.querySelector('input[name=txc]:checked').value; TX.push({id:Date.now(),date:v('txDate'),cat:c,amt:TXSIGN*Math.abs(amt),note:v('txNote')}); closeSheet(); render(); toast('Salvato: '+eur(Math.abs(amt))+' · '+CATS[c].label); break; }
    case 'fFixed': { const ms=[...f.querySelectorAll('input[name=fxm]:checked')].map(x=>+x.value); FIXED.push({id:Date.now(),name:v('fxName'),amt:pnum(v('fxAmt')),day:+v('fxDay'),rule:v('fxRule')==='months'&&ms.length?'months':'monthly',months:ms,cat:v('fxCat'),active:true}); closeSheet(); render(); toast('Spesa fissa aggiunta'); break; }
    case 'fAcc': { const id=+f.dataset.id; if(id){ const a=ACCOUNTS.find(x=>x.id===id); a.name=v('accName'); a.bal=pnum(v('accBal')); a.upd=iso(TODAY);} else ACCOUNTS.push({id:Date.now(),name:v('accName'),bal:pnum(v('accBal')),upd:iso(TODAY)}); closeSheet(); render(); toast('Saldo aggiornato'); break; }
    case 'fWatch': { const cs=[...f.querySelectorAll('input[name=wc]:checked')].map(x=>x.value); if(!cs.length) return; WATCH.push({id:'w'+Date.now(),label:v('wName')||cs.map(c=>CATS[c].label).join(' + '),cats:cs}); sheetWatchCfg(); render(); break; }
    case 'fAddWo': { const k=f.dataset.day; const g=v('woSrc'); const s=g?SCHEDA.days.find(x=>x.g==g):null; (PLAN[k]=PLAN[k]||[]).push({id:'m'+Date.now(),src:s?'scheda':'manual',g:s?.g,title:s?`Giorno ${s.g} · ${s.title}`:(v('woTitle')||'Allenamento'),sub:s?'Scheda '+SCHEDA.name:'Aggiunto a mano',time:v('woTime')||'18:30',done:false}); closeSheet(); render(); toast('Allenamento aggiunto'); break; }
    case 'fRace': HYROX.push({id:Date.now(),date:v('rDate'),place:v('rPlace'),kind:v('rKind'),time:v('rTime')}); HYROX.sort((a,b)=>a.date.localeCompare(b.date)); closeSheet(); render(); toast('Gara salvata'); break;
    case 'fBody': { const P=pnum(v('bP')), G=pnum(v('bG')), M=pnum(v('bM')); BODY.push({d:v('bD'),peso:P,mgp:G,mg:+(P*G/100).toFixed(1),mm:M,mus:+(M*.95).toFixed(1)}); closeSheet(); render(); toast('Controllo salvato'); break; }
    case 'fDish': { const m=v('dMeal'); const items=(v('dItems')||'').split('\n').filter(Boolean).map(l=>l.split(';').map(x=>x.trim())).map(x=>[x[0],x[1]||'']); DISHES[m].push({id:'d'+Date.now(),name:v('dName'),tag:v('dTag')||undefined,items:items.length?items:[[v('dName'),'']]}); closeSheet(); render(); toast('Piatto aggiunto'); break; }
    case 'fSimple': { const k=f.dataset.k;
      if(k==='newbook') BOOKS.push({id:Date.now(),m:v('sC')||'2026-10',title:v('sA'),author:v('sB')||''});
      if(k==='newresto') RESTOS.unshift({id:Date.now(),name:v('sA'),city:v('sB')||'',status:'da provare',vote:0,note:v('sC')||''});
      if(k==='newnote') NOTES.unshift({id:Date.now(),title:v('sA'),body:v('sB')||'',d:iso(TODAY)});
      if(k==='newgoal') GOALS.push({id:Date.now(),area:'Altro',name:v('sA'),unit:'',set:pnum(v('sB')),cur:pnum(v('sC')),hist:[pnum(v('sC'))*.9,pnum(v('sC'))]});
      closeSheet(); render(); toast('Salvato'); break; }
  }
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
$('#menuBtn').addEventListener('click',sheetMore);
$('#themeBtn').addEventListener('click',()=>{
  const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('los-theme',r.dataset.theme)}catch(x){}
});
// swipe-down per chiudere il foglio
(()=>{ let y0=null; const sh=$('#sheet'); sh.addEventListener('touchstart',e=>{ if(sh.scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0===null) return; const dy=e.touches[0].clientY-y0; if(dy>0){ sh.style.transition='none'; sh.style.transform=`translateY(${dy}px)`; } },{passive:true});
  sh.addEventListener('touchend',e=>{ if(y0===null) return; const dy=(e.changedTouches[0].clientY-y0); sh.style.transition=''; sh.style.transform=''; if(dy>110) closeSheet(); y0=null; }); })();

try{ const t=localStorage.getItem('los-theme'); if(t) document.documentElement.dataset.theme=t; if(localStorage.getItem('los-auth')) $('#login').classList.add('gone'); const v=localStorage.getItem('los-view'); if(v) S.view=v; }catch(e){}
render();
</script>
