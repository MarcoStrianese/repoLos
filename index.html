<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOS · Life Operating System</title>
<meta name="description" content="Il sistema operativo della mia vita: lavoro, finanze, sport, dieta.">
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F16" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try{const t=localStorage.getItem('los-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<div class="splash" id="splash">
  <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><g class="loopanim"><path d="M52 32a20 20 0 1 1-6-14.3"/><path d="M47 9v9h-9"/></g><circle cx="32" cy="32" r="6" fill="currentColor" stroke="none"/></svg>
</div>

<div class="login gone" id="login">
  <form class="box" id="loginForm" autocomplete="on">
    <svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><g class="loopanim"><path d="M52 32a20 20 0 1 1-6-14.3"/><path d="M47 9v9h-9"/></g><circle cx="32" cy="32" r="6" fill="currentColor" stroke="none"/></svg>
    <div><h1>LOS</h1><p class="muted" style="margin:6px 0 0">Life Operating System. Setpoint, misura, correzione.</p></div>
    <div class="field"><label for="lemail">Email</label><input class="input" id="lemail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lpwd">Password</label><input class="input" id="lpwd" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr" hidden></div>
    <button class="btn accent block" type="submit" id="loginBtn">Accedi</button>
    <p class="faint small" style="margin:0">Accedi una volta su questo dispositivo: la sessione resta salvata finché non esci.</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="appbar" id="appbar">
      <button class="iconbtn menubtn" id="menuBtn" aria-label="Apri il menu" data-act="drawer"></button>
      <div class="title" id="crumb"></div>
      <span id="barActions"></span>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<nav class="drawer" id="drawer" aria-label="Sezioni"></nav>
<div class="dscrim" id="dscrim" data-act="drawer-close"></div>
<div id="fabHost"></div>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="confirm" id="confirm"><div class="box" id="confirmBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/db.js"></script>
<script src="js/engines.js"></script>
<script src="js/parsers.js"></script>
<script src="js/v-today.js"></script>
<script src="js/v-work.js"></script>
<script src="js/v-fin.js"></script>
<script src="js/v-sport.js"></script>
<script src="js/v-diet.js"></script>
<script src="js/v-misc.js"></script>
<script src="js/main.js"></script>
</body>
</html>
